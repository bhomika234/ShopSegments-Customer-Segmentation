<html lang="en">
<head>

<title>ShopSegments Dashboard</title>

<style>
:root{--bg:#F4F6FA;--card:#fff;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--soft:#F1F5F9;--pri:#4F6FE8;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1120;--card:#151D2E;--ink:#E8EDF5;--mut:#94A3B8;--line:#26324A;--soft:#1C2740;--pri:#7B93F5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1120;--card:#151D2E;--ink:#E8EDF5;--mut:#94A3B8;--line:#26324A;--soft:#1C2740;--pri:#7B93F5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:30px;margin:0;letter-spacing:-.02em}.sub{color:var(--mut);margin:4px 0 20px;font-size:15px}
h2{font-size:16px;margin:0 0 12px;font-weight:600}h3{font-size:13px;margin:16px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{text-align:center}.kpi small{color:var(--mut);font-size:13px;font-weight:500}.kpi b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.chk{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;font-size:14px}
.chk input{width:17px;height:17px;margin:0;accent-color:var(--pri)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500;width:100%}
.seg2{display:flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px}
.seg2 button{flex:1;border:0;background:none;padding:6px 4px;border-radius:6px;font:inherit;font-size:12.5px;color:var(--mut);cursor:pointer}
.seg2 button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg2 button:focus-visible,select:focus-visible,.chk input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg{display:block;width:100%;height:auto}
.mapbox{position:relative}
.tip{position:absolute;right:8px;top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;min-width:150px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tip b{display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:500;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}.r{text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin-top:8px}.legend span{display:flex;align-items:center;gap:6px}
ul.ins{margin:0;padding-left:18px}ul.ins li{margin-bottom:7px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.sc{border-top:4px solid}.sc .n{font-size:26px;font-weight:700}.sc .act{background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13px}
.sc ul{margin:4px 0 0;padding-left:18px;color:var(--ink)}.mut{color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
ol.rec{margin:0;padding:0;list-style:none;counter-reset:r}ol.rec li{counter-increment:r;display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
ol.rec li:before{content:counter(r);color:var(--mut);width:18px;text-align:right;flex:none}ol.rec li:last-child{border:0}
.bar{height:10px;border-radius:5px;background:var(--pri)}.note{color:var(--mut);font-size:12.5px;margin-top:8px}
@media(max-width:1150px){.grid{grid-template-columns:1fr}.segs{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media(max-width:560px){.segs{grid-template-columns:1fr}h1{font-size:24px}.kpi b{font-size:24px}}
</style>
</head>

const e=React.createElement,{useState,useMemo}=React;
let C=[],short=[],SEG=[];
const fmt=n=>Math.round(n).toLocaleString("en-GB"),gbp=n=>"£"+fmt(n);


function Kpi({t,v}){return e("div",{className:"card kpi"},e("small",null,t),e("b",null,v))}

function Scatter({pts,view,hov,setHov,all}){
  const W=640,H=360,P=28;
  const fx=p=>view==="umap"?p[0]:Math.log10(p[5]),fy=p=>view==="umap"?p[1]:Math.log10(Math.max(p[4],1));
  const ex=useMemo(()=>{const xs=all.map(fx),ys=all.map(fy);return[Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)]},[view]);
  const X=p=>P+(fx(p)-ex[0])/(ex[1]-ex[0])*(W-2*P),Y=p=>H-P-(fy(p)-ex[2])/(ex[3]-ex[2])*(H-2*P);
  return e("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Customer map"},
    e("rect",{x:0,y:0,width:W,height:H,fill:"var(--soft)",rx:8,opacity:.5}),
    view==="rfm"&&e("text",{x:W/2,y:H-6,textAnchor:"middle",fontSize:11,fill:"var(--mut)"},"More orders (log scale) →"),
    view==="rfm"&&e("text",{x:10,y:H/2,fontSize:11,fill:"var(--mut)",transform:`rotate(-90 10 ${H/2})`,textAnchor:"middle"},"Total spend (log scale) →"),
    pts.map(p=>e("circle",{key:p[3],cx:X(p),cy:Y(p),r:hov&&hov[3]===p[3]?6:3.2,fill:C[p[2]],fillOpacity:.75,stroke:hov&&hov[3]===p[3]?"var(--ink)":"none",
      onMouseEnter:()=>setHov(p),onClick:()=>setHov(p)})));
}

function Donut({vals}){
  const tot=vals.reduce((a,b)=>a+b,0)||1;let a0=-Math.PI/2;const R=80,r=46,cx=100,cy=100;
  const arcs=vals.map((v,i)=>{if(!v)return null;const a1=a0+v/tot*2*Math.PI-(v===tot?.0001:0),big=a1-a0>Math.PI?1:0;
    const P=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];const[x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[x2,y2]=P(a1,r),[x3,y3]=P(a0,r);
    const m=(a0+a1)/2,[tx,ty]=P(m,(R+r)/2);const d=`M${x0} ${y0}A${R} ${R} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${big} 0 ${x3} ${y3}Z`;a0=a1;
    return e("g",{key:i},e("path",{d,fill:C[i]}),v/tot>.06&&e("text",{x:tx,y:ty+4,textAnchor:"middle",fontSize:11,fontWeight:600,fill:"#fff"},Math.round(v/tot*100)+"%"))});
  return e("svg",{viewBox:"0 0 200 200",style:{maxWidth:210,margin:"0 auto"},role:"img","aria-label":"Segment share"},arcs,
    e("text",{x:100,y:98,textAnchor:"middle",fontSize:20,fontWeight:700,fill:"var(--ink)"},fmt(tot)),e("text",{x:100,y:115,textAnchor:"middle",fontSize:10,fill:"var(--mut)"},"customers"));
}

function Profiles({segs}){
  const _=0;
  const M=[["Avg spend","mon","#E8735A"],["Avg orders","freq","#4F6FE8"],["Recency (days)","rec","#5BBF9F"]];
  const W=640,H=230,P=30,gw=(W-P)/segs.length,bw=Math.min(34,gw/4);
  const mx=Object.fromEntries(M.map(([,k])=>[k,Math.max(...segs.map(s=>s[k]))]));
  return e("div",null,e("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Segment profiles"},
    [0,50,100].map(t=>e("g",{key:t},e("line",{x1:P,x2:W,y1:H-30-t*1.7,y2:H-30-t*1.7,stroke:"var(--line)"}),e("text",{x:P-4,y:H-26-t*1.7,textAnchor:"end",fontSize:10,fill:"var(--mut)"},t))),
    segs.map((s,i)=>e("g",{key:s.n,transform:`translate(${P+i*gw+gw/2-bw*1.5},0)`},
      M.map(([l,k,c],j)=>{const hh=s[k]/mx[k]*170;return e("rect",{key:k,x:j*bw,y:H-30-hh,width:bw-3,height:hh,fill:c,rx:3},e("title",null,`${s.short} · ${l}: ${k==="mon"?gbp(s[k]):s[k]}`))}),
      e("text",{x:bw*1.5,y:H-12,textAnchor:"middle",fontSize:11,fill:"var(--ink)"},s.short)))),
    e("div",{className:"legend"},M.map(([l,,c])=>e("span",{key:l},e("i",{className:"dot",style:{background:c}}),l)),e("span",null,"Each metric scaled 0–100 vs the highest segment. Hover a bar for the real value.")));
}

function Trend({sel,mt}){
  const W=1280,H=240,P=48,n=D.months.length;const vis=mt.map((s,i)=>i).filter(i=>sel[i]);
  const mx=Math.max(1,...vis.flatMap(i=>mt[i]));const X=k=>P+k/(n-1)*(W-P-8),Y=v=>H-24-v/mx*(H-40);
  return e("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Revenue by month"},
    [0,.5,1].map(t=>e("g",{key:t},e("line",{x1:P,x2:W,y1:Y(mx*t),y2:Y(mx*t),stroke:"var(--line)"}),e("text",{x:P-4,y:Y(mx*t)+4,textAnchor:"end",fontSize:10,fill:"var(--mut)"},"£"+Math.round(mx*t/1000)+"k"))),
    D.months.map((m,k)=>e("text",{key:m,x:X(k),y:H-6,textAnchor:"middle",fontSize:10,fill:"var(--mut)"},m.slice(2))),
